<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compliance • Gestão de tarefas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><link rel="stylesheet" href="style.css?v=23.1" defer><script defer src="app.js?v=23.1"></script></head><body><aside><div class="brand"><span class="shield">⬡</span><div><b>Compliance</b><small>Gestão de Tarefas</small></div></div><nav id="nav"><button data-page="dashboard" class="active">▦　Dashboard</button><button data-page="calendar">▣　Calendário</button><button data-page="today">☑　Tarefas de Hoje</button><button data-page="productivity">◈　Produtividade de Hoje</button><button data-page="plans">▤　Relatório dos Planos</button><button data-page="evidences">▣　Inventário de Evidências</button><button data-page="kanban">▥　Kanban</button><button data-page="tasks">☷　Todas as Atividades</button></nav><div class="sidebottom"><span id="saveState">● Aguardando Excel</span><button id="connectSide">📁 Buscar Excel na pasta</button><button id="logout" type="button" class="logout-button">⏻ Sair do aplicativo</button><small>Compliance Workspace • 2026</small></div></aside><main><header><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Visão geral das tarefas e microatividades</p></div><div class="actions"><button class="secondary" id="createDatabase" type="button">＋ Criar banco de dados</button><button class="secondary" id="connect">▤ Conectar Excel</button><button class="secondary" id="export">↓ Baixar Excel</button><button class="primary" id="add">＋ Nova tarefa</button></div></header><div id="content"></div></main><dialog id="editor"><form id="taskForm"><div class="dialoghead"><h2 id="editorTitle">Nova tarefa</h2><button type="button" class="iconbtn" id="close">✕</button></div><div class="formgrid"><label class="wide">Título da tarefa<input name="titulo" required maxlength="250" placeholder="Ex.: Revisar política de jornada"></label><label>Plano / Projeto<input name="plano" style="text-transform:uppercase" list="plansList" placeholder="Ex.: Políticas e Normas"></label><label>Responsável<input name="responsavel" placeholder="Nome do responsável"></label><label>Data de lembrete<input type="date" name="agendada"></label><label>Data de início<input type="date" name="inicio"></label><label>Prazo de entrega<input type="date" name="prazo"></label><div class="wide"><button type="button" class="secondary" id="scheduleToday">📅 Lembrar hoje</button></div><label>Recorrência<select name="recorrencia"><option value="Não">Não recorrente</option><option>Diária</option><option>Semanal</option><option>Mensal</option><option>Anual</option></select></label><label>Status<select name="status"><option>A Fazer</option><option>Em Andamento</option><option>Concluída</option></select></label><label>Prioridade<select name="prioridade"><option>Média</option><option>Alta</option><option>Baixa</option><option>Crítica</option></select></label><label class="wide">Rótulos (separados por vírgula)<input name="rotulos" placeholder="Política, RH, Urgente"></label><label class="wide">Descrição<textarea name="descricao" rows="2"></textarea></label><label class="wide">Observações<textarea name="observacoes" rows="2"></textarea></label></div><section class="microsection"><div class="microhead"><h3>Microatividades</h3><div class="micro-actions"><button type="button" class="secondary" id="inheritMicro">⧉ Herdar de outra tarefa</button><button type="button" class="secondary" id="addMicro">＋ Adicionar microatividade</button></div></div><div id="inheritPanel" class="inherit-panel" hidden><label for="inheritSource">Copiar microatividades da tarefa</label><select id="inheritSource"><option value="">Selecione uma tarefa...</option></select><label class="inherit-check"><input type="checkbox" id="inheritReplace"> Substituir microatividades atuais (desmarcado: adicionar)</label><div class="micro-actions"><button type="button" class="primary" id="inheritConfirm">Copiar microatividades</button><button type="button" class="secondary" id="inheritCancel">Cancelar</button></div><p class="inherit-hint">As cópias são independentes da tarefa original, com status “A Fazer”. Confira as datas antes de salvar.</p></div><div id="microRows"></div></section><div class="dialogactions"><button type="button" class="danger" id="deleteTask" hidden>Excluir tarefa</button><button type="button" class="secondary" id="cancel">Cancelar</button><button type="submit" class="primary">Salvar tarefa</button></div></form></dialog><datalist id="plansList"></datalist><div id="toast" role="status"></div><dialog id="evidenceDialog" class="ev-dialog"></dialog></body></html>
